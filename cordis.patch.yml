- insert:
    - id: dsh-liquid-glass
      name: '@local/dsh-liquid-glass'
      # 刻意**不**声明 inject: [webServer]。
      #
      # 走过两次弯路，结论是这条路不通，且有害：
      #   1) 只在 cordis.patch.yml 里写 inject   → 实测 127.0.0.1:19387/dshlg-control/health 仍 404
      #   2) 再补上模块级 export const inject   → 重启后仍 404
      # 根因（index.js 文件头早有记录）：插件被 insert 在最外层，而 Cordis 服务查找是
      # 子→父单向的，插在外层就看不到内层提供的服务。
      # 更关键的是：inject 是**硬依赖** —— 在没有 web 组合的 profile（headless）里
      # 插件会整体不激活。用一个拿不到的服务去换激活风险，不划算。
      #
      # 现在的方案：控制中心 API 挂在**插件自己的 3932x 本地服务**上
      # （就是提供 /__alive /__wallpapers 的那个，已被壁纸功能长期验证）。
      # 客户端通过 /__alive 的 features 里的 "control" 判断能力，见 index.js。
